name: PR — Checks (taille + reviewer)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  pr-size-check:
    name: Vérifier taille et reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Ignorer les PRs en draft
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculer taille de la PR et vérifier reviewers
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions ?? 0;
            const deletions = pr.deletions ?? 0;
            const changed  = pr.changed_files ?? 0;
            const total    = additions + deletions;

            // ── Taille ────────────────────────────────────────────────────
            const SIZE_WARN  = 500;
            const SIZE_BLOCK = 1000;

            let sizeComment = null;
            if (total >= SIZE_BLOCK) {
              sizeComment = `## ⚠️ PR très volumineuse (${total} lignes modifiées)\n\n` +
                `Cette PR modifie **${total} lignes** (${additions} ajouts, ${deletions} suppressions) ` +
                `réparties sur **${changed} fichiers**.\n\n` +
                `> **Recommandation** : décomposer en PRs plus petites (< ${SIZE_WARN} lignes) ` +
                `pour faciliter la revue et réduire le risque d'erreur.\n\n` +
                `Si la taille est justifiée (ex : génération de code, migration), ajoutez le label \`large-pr\` ` +
                `et expliquez dans le body de la PR.`;
            } else if (total >= SIZE_WARN) {
              sizeComment = `## 📏 PR volumineuse (${total} lignes modifiées)\n\n` +
                `Cette PR modifie **${total} lignes** sur **${changed} fichiers**. ` +
                `Pensez à vérifier que le périmètre est bien délimité.`;
            }

            if (sizeComment) {
              await github.rest.issues.createComment({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                issue_number: pr.number,
                body: sizeComment,
              });
            }

            // ── Reviewer ──────────────────────────────────────────────────
            const reviewers  = pr.requested_reviewers  ?? [];
            const teamReviewers = pr.requested_teams   ?? [];
            const totalReviewers = reviewers.length + teamReviewers.length;

            if (totalReviewers === 0) {
              const reminderBody =
                `## 👁️ Aucun reviewer assigné\n\n` +
                `Cette PR ne comporte pas encore de reviewer. ` +
                `Pensez à assigner au moins **1 reviewer humain** avant le merge.\n\n` +
                `> Voir [git-commit-instructions.md](.github/git-commit-instructions.md) — ` +
                `_"PR obligatoire vers \`main\`"_.`;

              await github.rest.issues.createComment({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                issue_number: pr.number,
                body: reminderBody,
              });
            }
