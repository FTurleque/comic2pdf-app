name: CI — Tests, Coverage, Docker Build & Security Audits

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_NAMESPACE: fturleque81
  IMAGE_PREFIX: comic2pdf

jobs:
  # ===========================================================================
  # Job 1 : Tests Python (pytest + coverage) — matrix par service
  # ===========================================================================
  python-tests:
    name: "Python tests — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Seuils CI Sprint 2 — tolérance initiale baseline−5
        # Baselines Sprint 1 : prep=85.30%, ocr=88.52%, orchestrator=66.36%
        # PR chore/coverage-thresholds-sprint2-stable pour monter à baseline−2 (83/86/64)
        include:
          - { service: prep-service,  cov_min: 80 }
          - { service: ocr-service,   cov_min: 83 }
          - { service: orchestrator,  cov_min: 61 }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Run pytest — serial d'abord (tests non parallélisables)
        working-directory: services/${{ matrix.service }}
        run: |
          pytest -m serial -n 0 \
            --cov=app \
            --cov-report=xml:coverage-serial.xml \
            --cov-report=term-missing \
            --junit-xml=junit-serial.xml \
            || serial_exit=$?
          # Accumuler la couverture pour la passe parallèle
          echo "SERIAL_EXIT=${serial_exit:-0}" >> "$GITHUB_ENV"

      - name: Run pytest — parallel (tests xdist-safe)
        working-directory: services/${{ matrix.service }}
        run: |
          pytest -m "not serial" -n auto --dist=loadscope \
            --cov=app \
            --cov-append \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=${{ matrix.cov_min }} \
            --junit-xml=junit-parallel.xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/coverage.xml
            services/${{ matrix.service }}/junit-serial.xml
            services/${{ matrix.service }}/junit-parallel.xml
          retention-days: 14

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: htmlcov-${{ matrix.service }}
          path: services/${{ matrix.service }}/htmlcov
          retention-days: 14

  # ===========================================================================
  # Job 2 : Audit sécurité Python (pip-audit) — REPORTING UNIQUEMENT
  #
  # ⚠️  Ce job est NON BLOQUANT (artefacts JSON, reporting).
  #     Le GATING HIGH/CRITICAL (bloquant en PR/push) est assuré par :
  #     → .github/workflows/dependency-audit.yml (job pip-audit-gating)
  #
  # Plan de sortie : supprimer ce job ou le refactorer en workflow réutilisable
  # après 1–2 cycles de stabilisation de dependency-audit.yml.
  # ===========================================================================
  python-audit:
    name: "Python security audit — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [prep-service, ocr-service, orchestrator]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        working-directory: services/${{ matrix.service }}
        run: pip-audit -r requirements.txt --format=json --output pip-audit-${{ matrix.service }}.json || true

      - name: Check for critical vulnerabilities (CVSS >= 7)
        working-directory: services/${{ matrix.service }}
        run: |
          pip-audit -r requirements.txt --format=json --output /tmp/audit.json || true
          python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/audit.json'))
              vulns = data.get('vulnerabilities', [])
              critical = [v for v in vulns if any(
                  float(alias.get('fix_versions', [0])[0] if alias.get('fix_versions') else 0) >= 0
                  for alias in v.get('aliases', [])
              )]
              if vulns:
                  print(f'⚠ {len(vulns)} vulnérabilité(s) trouvée(s). Voir le rapport pour détails.')
          except Exception as e:
              print(f'Audit ignoré : {e}')
          "

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-${{ matrix.service }}
          path: services/${{ matrix.service }}/pip-audit-${{ matrix.service }}.json
          retention-days: 14

  # ===========================================================================
  # Job 3 : Tests Java (mvn test) + rapport JaCoCo
  # ===========================================================================
  java-tests:
    name: Java tests (desktop-app)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests + JaCoCo check (anti-régression)
        working-directory: desktop-app
        run: mvn clean verify -Pcoverage -Pcoverage-check

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: desktop-app/target/site/jacoco/
          retention-days: 14

      - name: Upload JaCoCo XML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-xml
          path: desktop-app/target/site/jacoco/jacoco.xml
          retention-days: 14

  # ===========================================================================
  # Job 4 : Tests UI JavaFX (TestFX headless avec xvfb)
  # ===========================================================================
  java-ui-tests:
    name: Java UI tests (TestFX headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Install xvfb (virtual display)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests with xvfb + Monocle (headless)
        working-directory: desktop-app
        run: |
          xvfb-run -a mvn -q -Pui-tests test \
            -Dtestfx.headless=true \
            -Dprism.order=sw \
            -Dglass.platform=Monocle \
            -Dmonocle.platform=Headless \
            -Dprism.verbose=true

      - name: Upload UI test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-reports
          path: desktop-app/target/surefire-reports/**
          retention-days: 7

      - name: Upload UI test screenshots (si échec)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-screenshots
          path: desktop-app/target/test-screenshots/**
          retention-days: 7

      - name: Extract test metrics
        if: always()
        run: |
          cd desktop-app/target/surefire-reports
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import glob
          
          total_time = 0
          test_count = 0
          failures = 0
          
          for xml_file in glob.glob('TEST-*.xml'):
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  total_time += float(root.get('time', 0))
                  test_count += int(root.get('tests', 0))
                  failures += int(root.get('failures', 0)) + int(root.get('errors', 0))
              except Exception as e:
                  print(f"⚠ Erreur parsing {xml_file}: {e}")
          
          if test_count > 0:
              avg_time = total_time / test_count
              print(f"🧪 Tests UI : {test_count} tests en {total_time:.2f}s")
              print(f"⏱️  Temps moyen : {avg_time:.2f}s par test")
              print(f"✅ Succès : {test_count - failures}")
              print(f"❌ Échecs : {failures}")
          else:
              print("⚠ Aucun test UI trouvé")
          EOF

  # ===========================================================================
  # Job 5 : Audit sécurité Java (OWASP Dependency-Check) — REPORTING UNIQUEMENT
  #
  # ⚠️  Ce job est NON BLOQUANT sur les PRs (exécuté uniquement sur main ou
  #     label run-audit). Il produit un rapport JSON (artefact, rétention 14j).
  #     Le GATING Java CVE peut être renforcé via dependency-audit.yml si besoin.
  #
  # Plan de sortie : évaluer refactoring en workflow réutilisable après
  # 1–2 cycles de stabilisation de dependency-audit.yml.
  # ===========================================================================
  java-audit:
    name: Java OWASP Dependency-Check
    runs-on: ubuntu-latest
    # Exécuté uniquement sur main pour éviter de ralentir toutes les PRs
    # (le check NVD peut prendre plusieurs minutes la première fois)
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-audit')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('desktop-app/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        working-directory: desktop-app
        run: |
          mvn -q org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DassemblyAnalyzerEnabled=false \
            -Dformat=JSON \
            || true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-dependency-check
          path: desktop-app/target/dependency-check-report.json
          retention-days: 14

  # ===========================================================================
  # Job 6 : Docker build — validation sans publication (3 services)
  #   - matrix sur 3 services réels (orchestrator, prep-service, ocr-service)
  #   - push: false — uniquement un build de validation
  #   - cache GHA activé pour accélérer les rebuilds
  #   - N'exige PAS de secrets Docker Hub en PR (pas de push)
  # ===========================================================================
  docker-build:
    name: "Docker build (no push) — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: orchestrator
            context: services/orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - service: prep-service
            context: services/prep-service
            dockerfile: services/prep-service/Dockerfile
          - service: ocr-service
            context: services/ocr-service
            dockerfile: services/ocr-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 7 : CLI build — validation PyPI (sdist + wheel)
  #   - Construit le package CLI comic2pdf depuis pyproject.toml (racine)
  #   - twine check : valide le package avant publication
  #   - Upload dist/* en artefact (non publié en CI, publié uniquement sur tag)
  # ===========================================================================
  cli-build:
    name: CLI build (PyPI sdist + wheel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Twine check
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist-ci
          path: dist/
          retention-days: 7

  # ===========================================================================
  # Job 8 : Java installer build (jpackage) — validation sans publication
  #   - S'exécute uniquement sur ubuntu-latest en CI (validation rapide)
  #   - continue-on-error: true — ne bloque pas la PR si jpackage non configuré
  #   - Les builds multi-OS complets sont faits dans release.yml uniquement
  # ===========================================================================
  java-installer-build:
    name: Java installer build (jpackage — validation CI)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build fat JAR (mvn package)
        working-directory: desktop-app
        run: mvn -q clean package -DskipTests

      - name: Validate jpackage availability
        run: jpackage --version

      - name: Run jpackage (validation)
        shell: bash
        run: |
          JAR=$(find desktop-app/target -name "desktop-app-*-jar-with-dependencies.jar" \
                                        -o -name "desktop-app-*-shaded.jar" 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            JAR=$(find desktop-app/target -name "desktop-app-*.jar" \
                                          ! -name "*-sources.jar" \
                                          ! -name "*-tests.jar" 2>/dev/null | head -1)
          fi
          if [ -z "$JAR" ]; then
            echo "⚠ Aucun fat JAR trouvé — jpackage ignoré en CI (non bloquant)."
            exit 0
          fi
          echo "✅ JAR trouvé : $JAR"
          jpackage \
            --type deb \
            --name "comic2pdf-desktop" \
            --app-version "0.0.0-ci" \
            --input "$(dirname $JAR)" \
            --main-jar "$(basename $JAR)" \
            --dest /tmp/installer-ci/ \
            --vendor "comic2pdf-app" \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            && echo "✅ jpackage OK" || echo "⚠ jpackage non configuré — voir docs/release/publishing.md"


