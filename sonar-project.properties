# SonarCloud configuration for comic2pdf-app
sonar.organization=fturleque81
sonar.projectKey=fturleque81_comic2pdf-app
# Metadata
sonar.projectName=Comic2PDF App
sonar.projectVersion=0.1.0
# Source directories
sonar.sources=services,tools,desktop-app/src/main
# Test directories
sonar.tests=services/prep-service/tests,services/ocr-service/tests,services/orchestrator/tests,tests,desktop-app/src/test
# Python specific
sonar.python.version=3.12
sonar.python.coverage.reportPaths=services/prep-service/coverage.xml,services/ocr-service/coverage.xml,services/orchestrator/coverage.xml
# Java specific
sonar.java.source=21
sonar.java.binaries=desktop-app/target/classes
sonar.java.test.binaries=desktop-app/target/test-classes
# Exclusions
sonar.exclusions=**/.venv/**,**/venv/**,**/build/**,**/dist/**,**/__pycache__/**,**/.pytest_cache/**,**/target/**,**/*.egg-info/**
sonar.test.exclusions=**/tests/**,**/test_*.py
# Code coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/conftest.py
